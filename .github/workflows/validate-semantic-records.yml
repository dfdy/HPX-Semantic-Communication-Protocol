name: Validate agent semantic records
on:
  push:
    paths:
      - 'docs/engineering/semantic-protocol/**'
      - 'scripts/validate_semantic_records.py'
      - 'scripts/bootstrap_semantic_protocol.py'
      - 'scripts/rebuild_semantic_appendix.py'
      - 'scripts/protocol_context.py'
      - 'scripts/protocol_recovery.py'
      - 'scripts/protocol_amendments.py'
      - 'tests/test_*.py'
      - '.github/workflows/validate-semantic-records.yml'
  pull_request:
    paths:
      - 'docs/engineering/semantic-protocol/**'
      - 'scripts/validate_semantic_records.py'
      - 'scripts/bootstrap_semantic_protocol.py'
      - 'scripts/rebuild_semantic_appendix.py'
      - 'scripts/protocol_context.py'
      - 'scripts/protocol_recovery.py'
      - 'scripts/protocol_amendments.py'
      - 'tests/test_*.py'
      - '.github/workflows/validate-semantic-records.yml'
jobs:
  semantic-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.18,<5' 'PyYAML>=6,<7'
      - run: python scripts/bootstrap_semantic_protocol.py
      - run: python scripts/protocol_context.py --for implement --record-type implementation_evidence
      - run: python scripts/validate_semantic_records.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
